<!DOCTYPE html>
<!--suppress HtmlUnknownAttribute, HtmlUnknownTarget, HtmlUnknownTag, HttpUrlsUsage -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OUIMIIT</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-50/30 min-h-screen font-sans text-slate-900" x-data="planner()">
    <div class="max-w-4xl mx-auto px-4 py-8 sm:py-12">
        <header class="mb-8 text-center">
            <div class="flex items-center justify-center gap-3 mb-2">
                <div class="p-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M5.121 17.804A13.937 13.937 0 0112 16c2.5 0 4.847.655 6.879 1.804M15 10a3 3 0 11-6 0 3 3 0 016 0zm6 2a2 2 0 11-4 0 2 2 0 014 0zM7 12a2 2 0 11-4 0 2 2 0 014 0z" />
                    </svg>
                </div>
                <h1 class="text-3xl font-extrabold text-slate-800 tracking-tight">OUIMIIT</h1>
            </div>
            <p class="text-slate-500 text-sm font-medium uppercase tracking-widest">Planificateur de disponibilités</p>
        </header>

        <main>
            <!-- Loading State -->
            <template x-if="pollId && !config.users.length && !joinError">
                <div class="bg-white p-8 rounded-3xl border border-slate-100 text-center">
                    <div class="animate-pulse flex flex-col items-center">
                        <div class="rounded-full bg-slate-100 h-12 w-12 mb-4"></div>
                        <div class="h-4 bg-slate-100 rounded w-3/4 mb-2"></div>
                        <div class="h-4 bg-slate-100 rounded w-1/2"></div>
                    </div>
                </div>
            </template>

            <!-- Step 0: Join Poll -->
            <template x-if="!pollId">
                <div class="bg-white p-6 sm:p-8 rounded-3xl border border-slate-100">
                    <h2 class="text-xl font-bold text-slate-800 mb-6">Ouvrir un sondage</h2>
                    <div class="space-y-4">
                        <div>
                            <label class="sr-only" for="poll-id">ID du sondage</label>
                            <input
                                id="poll-id"
                                x-model.trim="joinId"
                                @input="joinError = ''"
                                @keydown.enter.prevent="joinPoll"
                                type="text"
                                placeholder="ID du sondage (ex: team-a)"
                                :class="joinError ? 'border-rose-300 focus:border-rose-400' : 'border-blue-100 focus:border-blue-300'"
                                class="w-full px-5 py-4 rounded-2xl border bg-blue-50/50 focus:outline-none transition-all text-lg">
                        </div>
                        <button
                            @click="joinPoll"
                            :disabled="!joinId"
                            :class="!joinId ? 'bg-slate-200 text-slate-400 cursor-not-allowed' : 'bg-slate-800 text-white hover:bg-slate-700 active:scale-[0.98]'"
                            class="w-full py-4 rounded-2xl font-bold text-lg transition-all">
                            Continuer
                        </button>
                        <p class="text-center text-sm text-rose-500 font-medium" x-show="joinError" x-text="joinError"></p>
                    </div>
                </div>
            </template>

            <!-- Step 1: User Selection -->
            <template x-if="pollId && !currentUser">
                <div class="space-y-4">
                    <div class="bg-white p-6 sm:p-8 rounded-3xl border border-slate-100">
                        <h2 class="text-xl font-bold text-slate-800 mb-6">Qui êtes-vous ?</h2>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <template x-for="user in config.users">
                                <button
                                    @click="currentUser = user"
                                    class="group relative flex items-center justify-between p-4 rounded-2xl border-2 border-blue-50 bg-white hover:border-blue-200 hover:bg-blue-50/30 transition-all text-left">
                                    <span class="font-bold text-slate-700" x-text="user"></span>
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-slate-300 group-hover:text-slate-500 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                                    </svg>
                                </button>
                            </template>
                        </div>
                    </div>
                </div>
            </template>

            <!-- Step 2: Availabilities -->
            <template x-if="pollId && currentUser">
                <div class="space-y-4">
                    <div class="flex items-center justify-between px-2">
                        <button @click="currentUser = ''" class="flex items-center text-slate-500 hover:text-slate-800 font-bold transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                            </svg>
                            Retour
                        </button>
                        <div class="text-right">
                            <p class="text-xs text-slate-400 font-bold uppercase tracking-wider">Session de</p>
                            <p class="font-bold text-slate-800" x-text="currentUser"></p>
                        </div>
                    </div>

                    <div class="bg-white overflow-hidden rounded-3xl border border-slate-100">
                        <div class="p-6 border-b border-blue-50 bg-white flex items-center justify-between">
                            <h2 class="text-lg font-bold text-slate-800">Choisissez vos disponibilités</h2>
                            <div class="flex gap-2">
                                <button @click="toggleAll(true)" class="text-[10px] font-extrabold text-emerald-600 bg-emerald-50 hover:bg-emerald-100 px-2 py-1 rounded-lg uppercase tracking-wider transition-colors">Tout OUI</button>
                                <button @click="toggleAll(false)" class="text-[10px] font-extrabold text-rose-600 bg-rose-50 hover:bg-rose-100 px-2 py-1 rounded-lg uppercase tracking-wider transition-colors">Tout NON</button>
                            </div>
                        </div>
                        <div class="divide-y divide-blue-50/50">
                            <template x-for="date in config.dates">
                                <div class="p-4 flex items-center justify-between group transition-colors hover:bg-blue-50/20">
                                    <div class="flex flex-col">
                                        <span class="text-xs font-bold text-slate-400 uppercase tracking-tight" x-text="formatWeekdayShort(date)"></span>
                                        <span class="font-bold text-slate-700" x-text="formatDateShortNoYear(date)"></span>
                                    </div>
                                    <div class="flex items-center gap-4">
                                        <div class="w-2.5 h-2.5 rounded-full" :class="responses[currentUser]?.[date] ? 'bg-emerald-500' : 'bg-rose-500'"></div>
                                        <button @click="toggleDate(date)"
                                                :disabled="isSaving"
                                                class="relative inline-flex h-9 w-20 items-center rounded-full transition-colors focus:outline-none"
                                                :class="[
                                                    responses[currentUser]?.[date] ? 'bg-emerald-500' : 'bg-slate-200',
                                                    isSaving ? 'opacity-50 cursor-wait' : 'cursor-pointer'
                                                ]">
                                            <span class="absolute left-2 text-xs font-bold text-white transition-opacity duration-200"
                                                  :class="responses[currentUser]?.[date] ? 'opacity-100' : 'opacity-0'">OUI</span>
                                            <span class="absolute right-2 text-xs font-bold text-slate-400 transition-opacity duration-200"
                                                  :class="responses[currentUser]?.[date] ? 'opacity-0' : 'opacity-100'">NON</span>
                                            <span
                                                :class="responses[currentUser]?.[date] ? 'translate-x-12' : 'translate-x-1'"
                                                class="inline-block h-7 w-7 transform rounded-full bg-white transition-transform z-10"
                                            ></span>
                                        </button>
                                    </div>
                                </div>
                            </template>
                        </div>
                    <div class="p-6 bg-white flex justify-center">
                            <button @click="currentUser = ''" class="bg-slate-800 text-white px-8 py-3 rounded-2xl font-bold hover:bg-slate-700 active:scale-95 transition-all">
                                Terminer
                            </button>
                        </div>
                    </div>
                </div>
            </template>

            <!-- Step 3: Global Overview -->
            <template x-if="pollId && !currentUser">
                <div class="mt-6 space-y-4" x-transition>
                    <div class="bg-white p-6 sm:p-8 rounded-3xl border border-slate-100 overflow-hidden">
                        <div class="flex items-center justify-between mb-6">
                            <h3 class="text-xl font-bold text-slate-800">Disponibilités</h3>
                            <div class="flex items-center gap-2">
                                <span class="flex items-center gap-1 text-xs font-bold text-emerald-600 bg-emerald-50 px-2 py-1 rounded-lg">
                                    <span class="w-2 h-2 bg-emerald-500 rounded-full"></span> OUI
                                </span>
                                <span class="flex items-center gap-1 text-xs font-bold text-rose-600 bg-rose-50 px-2 py-1 rounded-lg">
                                    <span class="w-2 h-2 bg-rose-500 rounded-full"></span> NON
                                </span>
                            </div>
                        </div>

                        <div class="overflow-x-auto -mx-6 sm:mx-0">
                            <table class="w-full text-left border-collapse">
                                <thead>
                                    <tr>
                                        <th class="p-4 border-b border-slate-200 text-xs font-bold text-slate-400 uppercase tracking-widest">Date</th>
                                        <th class="p-4 border-b border-slate-200 text-center text-xs font-bold text-slate-400 uppercase tracking-widest">Total</th>
                                        <template x-for="user in config.users">
                                            <th class="p-4 border-b border-slate-200 text-center text-xs font-bold text-slate-400 uppercase tracking-widest" x-text="user.slice(0, 3)"></th>
                                        </template>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100">
                                    <template x-for="date in config.dates">
                                        <tr :class="countAvailable(date) >= minPeople ? 'bg-blue-50/40' : ''">
                                            <td class="p-4">
                                                <div class="flex flex-col">
                                                    <span class="text-[10px] font-bold text-slate-400 uppercase" x-text="formatWeekdayShort(date)"></span>
                                                    <span class="font-bold text-slate-700 whitespace-nowrap" x-text="formatDateShortNoYear(date)"></span>
                                                </div>
                                            </td>
                                            <td class="p-4 text-center">
                                                <span class="inline-flex items-center justify-center w-8 h-8 rounded-full font-bold text-sm"
                                                      :class="countAvailable(date) >= minPeople ? 'bg-emerald-100 text-emerald-700' : 'bg-blue-50 text-blue-600'"
                                                      x-text="countAvailable(date)"></span>
                                            </td>
                                            <template x-for="user in config.users">
                                                <td class="p-4 text-center">
                                                    <div class="w-4 h-4 mx-auto rounded-lg"
                                                         :class="responses[user]?.[date] ? 'bg-emerald-400' : 'bg-rose-200'"></div>
                                                </td>
                                            </template>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </template>
        </main>

        <!-- Actions Section -->
        <template x-if="pollId">
            <div class="mt-6 flex flex-col sm:flex-row items-center justify-center gap-4" x-data="{ copied: false }">
                <button 
                    @click="
                        navigator.clipboard.writeText(window.location.href); 
                        copied = true; 
                        setTimeout(() => copied = false, 2000)
                    "
                    class="flex items-center gap-2 px-6 py-3 rounded-2xl bg-white border border-slate-100 text-slate-600 font-bold hover:bg-blue-50 hover:border-blue-100 transition-all active:scale-95"
                >
                    <svg x-show="!copied" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
                    </svg>
                    <svg x-show="copied" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-emerald-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                    </svg>
                    <span x-text="copied ? 'Lien copié !' : 'Copier le lien du sondage'"></span>
                </button>

                <button 
                    @click="
                        pollId = '';
                        currentUser = '';
                        const url = new URL(window.location.href);
                        url.searchParams.delete('id');
                        window.history.replaceState({}, '', url);
                    "
                    class="text-slate-400 hover:text-slate-600 font-bold text-sm transition-colors px-4 py-2"
                >
                    Fermer le sondage
                </button>
            </div>
        </template>

        <footer class="mt-12 text-center text-slate-400 text-xs font-bold uppercase tracking-widest">
            &copy; 2026 OUIMIIT &middot; Simple & Efficace
        </footer>
    </div>

    <script>
        function planner() {
            return {
                config: { users: [], dates: [] },
                responses: {},
                currentUser: '',
                isSaving: false,
                pendingSaves: [],
                pollId: '',
                joinId: '',
                joinError: '',
                async init() {
                    const params = new URLSearchParams(window.location.search);
                    this.joinId = params.get('id') || '';
                    if (this.joinId) {
                        const result = await this.loadPoll(this.joinId);
                        if (result.ok) {
                            this.pollId = this.joinId;
                        } else {
                            this.joinError = result.message;
                        }
                    }
                },
                pollUrl(id) {
                    return `/api/poll?id=${encodeURIComponent(id)}`;
                },
                async loadPoll(id) {
                    const response = await fetch(this.pollUrl(id));
                    if (!response.ok) {
                        let message = 'Sondage introuvable';
                        try {
                            const data = await response.json();
                            message = data.error || message;
                        } catch (error) {
                            message = 'Sondage introuvable';
                        }
                        return { ok: false, message };
                    }
                    const poll = await response.json();
                    this.config = poll.config || { users: [], dates: [] };
                    this.responses = poll.responses || {};
                    return { ok: true };
                },
                async joinPoll() {
                    if (!this.joinId) return;
                    this.joinError = '';
                    const result = await this.loadPoll(this.joinId);
                    if (!result.ok) {
                        this.joinError = result.message;
                        return;
                    }
                    this.pollId = this.joinId;
                    const url = new URL(window.location.href);
                    url.searchParams.set('id', this.pollId);
                    window.history.replaceState({}, '', url);
                },
                  formatWeekdayShort(value) {
                    const date = new Date(`${value}T00:00:00Z`);
                    let weekday = new Intl.DateTimeFormat('fr-FR', { weekday: 'short', timeZone: 'UTC' }).format(date);
                    weekday = weekday.replace('.', '');
                    return weekday.charAt(0).toUpperCase() + weekday.slice(1, 2) + '.';
                },
                formatDateShortNoYear(value) {
                    const date = new Date(`${value}T00:00:00Z`);
                    return new Intl.DateTimeFormat('fr-FR', { day: '2-digit', month: '2-digit', timeZone: 'UTC' }).format(date).replace(/\//g, '.');
                },
                countAvailable(date) {
                    return this.config.users.reduce((count, user) => {
                        return count + (this.responses[user]?.[date] ? 1 : 0);
                    }, 0);
                },
                get minPeople() {
                    return Number(this.config.minPeople) || 0;
                },
                toggleAll(available) {
                    if (!this.currentUser) return;
                    const updates = [];
                    this.config.dates.forEach(date => {
                        if (!this.responses[this.currentUser]) this.responses[this.currentUser] = {};
                        if (this.responses[this.currentUser][date] !== available) {
                            this.responses[this.currentUser][date] = available;
                            updates.push({ date, available });
                        }
                    });
                    if (updates.length > 0) {
                        this.queueBulkSave(updates);
                    }
                },
                toggleDate(date) {
                    if (!this.responses[this.currentUser]) this.responses[this.currentUser] = {};
                    const nextValue = !this.responses[this.currentUser][date];
                    this.responses[this.currentUser][date] = nextValue;
                    this.queueSave(date, nextValue);
                },
                queueSave(date, available) {
                    this.pendingSaves.push({
                        user: this.currentUser,
                        updates: [{ date, available }]
                    });
                    this.processSaveQueue();
                },
                queueBulkSave(updates) {
                    this.pendingSaves.push({
                        user: this.currentUser,
                        updates
                    });
                    this.processSaveQueue();
                },
                async processSaveQueue() {
                    if (this.isSaving || this.pendingSaves.length === 0) return;
                    this.isSaving = true;
                    const next = this.pendingSaves[0];
                    try {
                        const response = await fetch(this.pollUrl(this.pollId), {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(next)
                        });
                        if (response.ok) {
                            const poll = await response.json();
                            this.config = poll.config || { users: [], dates: [] };
                            this.responses = poll.responses || {};
                            this.pendingSaves.shift();
                        }
                    } catch (e) {
                        console.error("Save failed", e);
                    } finally {
                        this.isSaving = false;
                        this.processSaveQueue();
                    }
                }
            }
        }
    </script>
</body>
</html>
