<!DOCTYPE html>
<!--suppress HtmlUnknownAttribute, HtmlUnknownTarget, HtmlUnknownTag, HttpUrlsUsage -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OUIMIIT</title>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white p-2 sm:bg-slate-100 sm:p-4 md:p-8" x-data="planner()">
    <div class="max-w-4xl mx-auto bg-white p-4 sm:p-6 rounded-none shadow-none sm:rounded-xl sm:shadow-lg">
        <h1 class="text-2xl font-bold text-slate-800 mb-6 border-b pb-2">📅 OUIMIIT</h1>

        <template x-if="pollId">
            <div class="mb-8">
                <label class="block text-sm font-semibold text-gray-500 uppercase tracking-wider mb-3">Qui êtes-vous ?</label>
                <div class="flex flex-wrap gap-2">
                    <template x-for="user in config.users">
                        <button
                                @click="currentUser = currentUser === user ? '' : user"
                                x-text="user"
                                :class="currentUser === user ? 'bg-indigo-600 text-white shadow-md' : 'bg-white text-slate-600 border border-slate-200 hover:border-indigo-400'"
                                class="px-5 py-2 rounded-full text-sm font-medium transition-all duration-200 active:scale-95">
                        </button>
                    </template>
                </div>
            </div>
        </template>

        <template x-if="!pollId">
            <div class="mb-8 bg-gray-50 rounded-lg p-4">
                <label class="block text-sm font-semibold text-gray-500 uppercase tracking-wider mb-3">Rejoindre un sondage</label>
                <div class="flex flex-col sm:flex-row gap-3">
                    <label class="sr-only" for="poll-id">ID du sondage</label>
                    <input
                        id="poll-id"
                        x-model.trim="joinId"
                        @input="joinError = ''"
                        @keydown.enter.prevent="joinPoll"
                        type="text"
                        placeholder="ID du sondage"
                        :class="joinError ? 'border-rose-400 focus:ring-rose-300' : 'border-slate-200 focus:ring-indigo-400'"
                        class="flex-1 px-4 py-2 rounded-lg border focus:outline-none focus:ring-2">
                    <button
                        @click="joinPoll"
                        :disabled="!joinId"
                        :class="!joinId ? 'bg-slate-300 text-slate-600' : 'bg-indigo-600 text-white hover:bg-indigo-700'"
                        class="px-5 py-2 rounded-lg font-semibold transition">
                        Ouvrir
                    </button>
                </div>
                <p class="text-xs text-slate-500 mt-2">Exemple : <span class="font-semibold">team-a</span></p>
                <p class="text-xs text-rose-600 mt-2" x-show="joinError" x-text="joinError"></p>
            </div>
        </template>

        <template x-if="pollId && currentUser">
            <div class="space-y-3">
                <template x-for="date in config.dates">
                    <div class="flex items-center justify-between p-3 bg-gray-50 rounded-lg">
                        <span class="font-medium text-slate-700">
                            <span class="sm:hidden" x-text="formatDateWithWeekdayShort(date)"></span>
                            <span class="hidden sm:inline" x-text="formatDateWithWeekday(date)"></span>
                        </span>
                        <div class="flex items-center gap-3">
                            <span class="text-xs font-semibold text-slate-500" x-text="countAvailable(date) + ' / ' + config.users.length"></span>
                            <button @click="toggleDate(date)"
                                    :disabled="isSaving"
                                    :class="[
                                        responses[currentUser]?.[date] ? 'bg-emerald-500 shadow-emerald-200' : 'bg-rose-400 shadow-rose-200',
                                        isSaving ? 'bg-slate-300 shadow-none text-slate-700 cursor-wait' : ''
                                    ]"
                                    class="text-white px-3 py-1 rounded-full text-xs font-bold shadow-md transition-all active:scale-95 min-w-[6rem] text-center sm:px-4 sm:py-1.5 sm:text-sm sm:min-w-[9rem]">
                                <span x-text="responses[currentUser]?.[date] ? 'Disponible' : 'Indisponible'"></span>
                            </button>
                        </div>
                    </div>
                </template>
                <div class="flex justify-end pt-1 pr-3">
                        <button @click="currentUser = ''"
                                class="bg-slate-300 text-slate-800 rounded-full font-bold shadow-md transition-all active:scale-95 text-xs px-3 py-1 min-w-[6rem] text-center sm:px-4 sm:py-1.5 sm:text-sm sm:min-w-[9rem]">
                            Terminé
                        </button>
                </div>
            </div>
        </template>

        <template x-if="pollId">
            <div class="mt-10">
                <h3 class="text-lg font-bold text-slate-800 mb-4">Vue d'ensemble</h3>
                <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                        <thead>
                            <tr>
                                <th class="p-2 border-b md:hidden">Date</th>
                                <th class="p-2 border-b hidden md:table-cell" colspan="2">Date</th>
                                <th class="p-2 border-b text-center text-xs sm:hidden">#</th>
                                <th class="p-2 border-b text-center text-xs hidden sm:table-cell">Nombre</th>
                                <template x-for="user in config.users">
                                    <th class="p-2 border-b text-center text-xs">
                                        <span class="sm:hidden" x-text="user.slice(0, 2)"></span>
                                        <span class="hidden sm:inline" x-text="user"></span>
                                    </th>
                                </template>
                            </tr>
                        </thead>
                    <tbody>
                            <template x-for="date in config.dates">
                                <tr :class="countAvailable(date) >= minPeople ? 'bg-gray-100' : ''">
                                    <td class="p-2 border-b hidden md:table-cell" x-text="formatWeekdayShort(date)"></td>
                                    <td class="p-2 border-b text-sm font-medium">
                                        <span class="sm:hidden" x-text="formatDateShortNoYear(date)"></span>
                                        <span class="hidden sm:inline md:hidden" x-text="formatDateShort(date)"></span>
                                        <span class="hidden md:inline" x-text="formatDate(date)"></span>
                                    </td>
                                    <td class="p-2 border-b text-center text-sm font-semibold" x-text="countAvailable(date)"></td>
                                    <template x-for="user in config.users">
                                        <td class="p-2 border-b text-center">
                                            <div class="w-3 h-3 mx-auto rounded-full"
                                                 :class="responses[user]?.[date] ? 'bg-emerald-500' : 'bg-rose-300'"></div>
                                        </td>
                                    </template>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </div>
        </template>
    </div>

    <script>
        function planner() {
            return {
                config: { users: [], dates: [] },
                responses: {},
                currentUser: '',
                isSaving: false,
                pendingSaves: [],
                pollId: '',
                joinId: '',
                joinError: '',
                async init() {
                    const params = new URLSearchParams(window.location.search);
                    this.joinId = params.get('id') || '';
                    if (this.joinId) {
                        const result = await this.loadPoll(this.joinId);
                        if (result.ok) {
                            this.pollId = this.joinId;
                        } else {
                            this.joinError = result.message;
                        }
                    }
                },
                pollUrl(id) {
                    return `/api/poll?id=${encodeURIComponent(id)}`;
                },
                async loadPoll(id) {
                    const response = await fetch(this.pollUrl(id));
                    if (!response.ok) {
                        let message = 'Sondage introuvable';
                        try {
                            const data = await response.json();
                            message = data.error || message;
                        } catch (error) {
                            message = 'Sondage introuvable';
                        }
                        return { ok: false, message };
                    }
                    const poll = await response.json();
                    this.config = poll.config || { users: [], dates: [] };
                    this.responses = poll.responses || {};
                    return { ok: true };
                },
                async joinPoll() {
                    if (!this.joinId) return;
                    this.joinError = '';
                    const result = await this.loadPoll(this.joinId);
                    if (!result.ok) {
                        this.joinError = result.message;
                        return;
                    }
                    this.pollId = this.joinId;
                    const url = new URL(window.location.href);
                    url.searchParams.set('id', this.pollId);
                    window.history.replaceState({}, '', url);
                },
                  formatWeekdayShort(value) {
                    const parts = value.split('-');
                    if (parts.length !== 3) return value;
                    const year = Number(parts[0]);
                    const month = Number(parts[1]) - 1;
                    const day = Number(parts[2]);
                    const date = new Date(Date.UTC(year, month, day));
                    const weekdays = [
                      'lundi',
                      'mardi',
                      'mercredi',
                      'jeudi',
                      'vendredi',
                      'samedi',
                      'dimanche',
                    ];
                    const weekday = weekdays[date.getUTCDay()] || '';
                    const capitalized = weekday ? `${weekday[0].toUpperCase()}${weekday.slice(1)}` : '';
                    return `${capitalized.slice(0, 2)}.`;
                  },
                formatDate(value) {
                    const parts = value.split('-');
                    if (parts.length !== 3) return value;
                    const monthIndex = Number(parts[1]) - 1;
                    const months = [
                        'janvier',
                        'février',
                        'mars',
                        'avril',
                        'mai',
                        'juin',
                        'juillet',
                        'août',
                        'septembre',
                        'octobre',
                        'novembre',
                        'décembre'
                    ];
                    const monthName = months[monthIndex];
                    if (!monthName) return value;
                    const day = parts[2].padStart(2, '0');
                    return `${day} ${monthName} ${parts[0]}`;
                },
                formatDateWithWeekday(value) {
                    const parts = value.split('-');
                    if (parts.length !== 3) return value;
                    const year = Number(parts[0]);
                    const month = Number(parts[1]) - 1;
                    const day = Number(parts[2]);
                    const date = new Date(Date.UTC(year, month, day));
                    const weekdays = [
                        'lundi',
                        'mardi',
                        'mercredi',
                        'jeudi',
                        'vendredi',
                        'samedi',
                        'dimanche',
                    ];
                    const weekday = weekdays[date.getUTCDay()] || '';
                    const capitalized = weekday ? `${weekday[0].toUpperCase()}${weekday.slice(1)}` : '';
                    return `${capitalized} ${this.formatDate(value)}`;
                },
                formatDateWithWeekdayShort(value) {
                    const parts = value.split('-');
                    if (parts.length !== 3) return value;
                    const year = Number(parts[0]);
                    const month = Number(parts[1]) - 1;
                    const day = Number(parts[2]);
                    const date = new Date(Date.UTC(year, month, day));
                    const weekdays = [
                        'dimanche',
                        'lundi',
                        'mardi',
                        'mercredi',
                        'jeudi',
                        'vendredi',
                        'samedi'
                    ];
                    const weekday = weekdays[date.getUTCDay()] || '';
                    const shortName = weekday ? `${weekday[0].toUpperCase()}${weekday[1]}.` : '';
                    return `${shortName} ${this.formatDate(value)}`;
                },
                formatDateShort(value) {
                    const parts = value.split('-');
                    if (parts.length !== 3) return value;
                    const day = parts[2].padStart(2, '0');
                    const month = parts[1].padStart(2, '0');
                    const year = parts[0].slice(-2);
                    return `${day}.${month}.${year}`;
                },
                  formatDateShortNoYear(value) {
                    const parts = value.split('-');
                    if (parts.length !== 3) return value;
                    const day = parts[2].padStart(2, '0');
                    const month = parts[1].padStart(2, '0');
                    return `${day}.${month}`;
                  },
                formatDateShortWithWeekday(value) {
                    const parts = value.split('-');
                    if (parts.length !== 3) return value;
                    const year = Number(parts[0]);
                    const month = Number(parts[1]) - 1;
                    const day = Number(parts[2]);
                    const date = new Date(Date.UTC(year, month, day));
                    const weekdays = [
                        'dimanche',
                        'lundi',
                        'mardi',
                        'mercredi',
                        'jeudi',
                        'vendredi',
                        'samedi'
                    ];
                    const weekday = weekdays[date.getUTCDay()] || '';
                    const shortName = weekday ? `${weekday[0].toUpperCase()}${weekday[1]}.` : '';
                    return `${shortName} ${this.formatDateShort(value)}`;
                },
                countAvailable(date) {
                    return this.config.users.reduce((count, user) => {
                        return count + (this.responses[user]?.[date] ? 1 : 0);
                    }, 0);
                },
                get minPeople() {
                    return Number(this.config.minPeople) || 0;
                },
                toggleDate(date) {
                    if (!this.responses[this.currentUser]) this.responses[this.currentUser] = {};
                    const nextValue = !this.responses[this.currentUser][date];
                    this.responses[this.currentUser][date] = nextValue;
                    this.queueSave(date, nextValue);
                },
                queueSave(date, available) {
                    this.pendingSaves.push({
                        user: this.currentUser,
                        date,
                        available
                    });
                    this.processSaveQueue();
                },
                async processSaveQueue() {
                    if (this.isSaving || this.pendingSaves.length === 0) return;
                    this.isSaving = true;
                    const next = this.pendingSaves.shift();
                    await fetch(this.pollUrl(this.pollId), {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(next)
                    });
                    await this.loadPoll(this.pollId);
                    this.isSaving = false;
                    this.processSaveQueue();
                }
            }
        }
    </script>
</body>
</html>
